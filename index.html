<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>今天</title>
<style>
:root{
  --bg:#0d0e11; --surface:#16181d; --surface2:#1d2026; --line:#262a31;
  --fg:#e9e7e3; --dim:#9aa0a6; --dim2:#6b7075;
  --accent:#8ab4f8;
  --game:#7bd88f; --toy:#f4a261; --local:#8ab4f8; --tech:#b39ddb; --ai:#b39ddb; --hot:#ff8a80;
  --r:14px; --r2:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Samsung One",system-ui,"Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:20;background:rgba(13,14,17,.86);
  backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 20px 0}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hmeta{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px}

.qwrap{position:relative;margin-top:12px}
.qwrap::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--dim2);font-size:17px;pointer-events:none;line-height:1}
#q{width:100%;margin:0;padding:11px 14px 11px 36px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);font-size:14px;font-family:inherit;outline:none}
#q:focus{border-color:#3b4250}
#q::placeholder{color:var(--dim2)}

#tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:12px 0 12px;margin:0 -20px;padding-left:20px;padding-right:24px;
  -webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
#tabs::-webkit-scrollbar{display:none}
button.tab{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:13px;font-family:inherit;
  font-weight:500;cursor:pointer;transition:.15s}
button.tab.on{background:rgba(138,180,248,.16);border-color:rgba(138,180,248,.45);color:var(--accent);font-weight:600}

/* ── 主體 ── */
main{padding:4px 20px calc(40px + env(safe-area-inset-bottom))}

.sect{display:flex;align-items:baseline;justify-content:space-between;
  margin:22px 0 12px}
.sect h2{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--fg)}
.sect span{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}

/* ── 今日收到：摺疊摘要 ── */
#notices{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
  background:var(--surface);margin-top:16px}
#notices summary{list-style:none;cursor:pointer;padding:15px 16px;
  display:flex;align-items:center;gap:10px}
#notices summary::-webkit-details-marker{display:none}
#notices .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
#notices .nt1{font-size:14.5px;font-weight:600}
#notices .nsub{font-size:11.5px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
#notices[open] summary{border-bottom:1px solid var(--line)}
.nlist{padding:6px 4px 8px}
.nitem{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03)}
.nitem:last-child{border-bottom:0}
.nitem .nh{font-size:11px;color:var(--dim2);letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:4px}
.nitem .nt{font-size:13.5px;line-height:1.6;color:var(--fg);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.nitem.open .nt{-webkit-line-clamp:unset}

/* ── 新聞卡 ── */
a.story{display:block;text-decoration:none;color:inherit;
  background:var(--surface);border-radius:var(--r);overflow:hidden;
  margin-bottom:10px;border:1px solid transparent;transition:.15s}
a.story:active{border-color:var(--line);transform:scale(.995)}
a.story.hero{border-radius:var(--r2);margin-bottom:14px}
.story .thumb{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--surface2)}
.story .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.story .body{padding:14px 16px 15px}
.story.hero .body{padding:16px 18px 18px}
.story .t{font-size:16px;font-weight:600;line-height:1.42;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story.hero .t{font-size:20px;line-height:1.36;letter-spacing:-.02em;-webkit-line-clamp:4}
.story .meta{display:flex;align-items:center;gap:7px;margin-top:9px;
  font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.story .meta .src{color:var(--dim);font-weight:500}
.story .meta img.fav{width:14px;height:14px;border-radius:3px;flex:0 0 auto;background:#fff;object-fit:contain;padding:1px}
.story .meta .sep{opacity:.45}

/* 純文字卡（無圖）左側色條 */
a.story.plain .body{padding-left:16px}

details.more>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--dim);
  padding:14px 0 10px;text-align:center;font-weight:500}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:" ▾"}
details.more[open]>summary::after{content:" ▴"}

.msg{padding:60px 20px;text-align:center;color:var(--dim2);font-size:14px}

/* ── 閱讀模式 ── */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  flex-direction:column;overscroll-behavior:contain}
#reader.on{display:flex}
.rbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);background:rgba(13,14,17,.9);backdrop-filter:blur(16px)}
#rclose{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);
  color:var(--fg);font-size:16px;cursor:pointer;flex:0 0 auto}
.rsrc{font-size:11.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwrap{flex:1;overflow-y:auto;padding:22px 20px calc(60px + env(safe-area-inset-bottom))}
.rwrap h2{font-size:23px;line-height:1.36;letter-spacing:-.02em;font-weight:700;margin-bottom:14px}
.rorig{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);
  padding-left:10px;margin-bottom:18px;line-height:1.5}
.rtext p{font-size:15.5px;line-height:1.78;color:#d6d3cf;margin-bottom:16px}
.rnone{font-size:13px;color:var(--dim2);margin-bottom:14px}
.ropen{display:inline-block;margin-top:8px;padding:12px 18px;border-radius:12px;
  background:var(--surface2);color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>今天</h1>
    <div class="hmeta" id="meta"></div>
  </div>
  <div class="sub" id="today"></div>
  <div class="qwrap"><input id="q" placeholder="搜尋標題或來源…" autocomplete="off"></div>
  <nav id="tabs"></nav>
</header>

<main id="list"><div class="msg">載入中…</div></main>

<div id="reader">
  <div class="rbar">
    <button id="rclose" aria-label="關閉">✕</button>
    <span class="rsrc" id="rsrc"></span>
  </div>
  <div class="rwrap" id="rbody"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let PICKS = [], ALL = [], CATS = [], cat = "all", q = "", BYLINK = {}, NOTES = {}, NOTICES = [];

const COLOR = {game:"var(--game)",tech:"var(--tech)",ai:"var(--ai)",local:"var(--local)",
  toy:"var(--toy)",image:"var(--tech)",pipeline:"var(--tech)",hermes:"var(--tech)",
  hype:"var(--toy)",news:"var(--local)"};

const LABEL = {game:"遊戲",tech:"科技",ai:"AI",local:"本地",toy:"玩具模型",
  image:"圖像",pipeline:"工具",hermes:"Hermes",hype:"潮物",news:"新聞"};

/* cron 的 slug → 人看得懂的名字 */
const JOBNAME = {
  "carousell-videogame-watch":"Carousell 上新",
  "news-digest-evening":"今日新聞摘要",
  "cex-morning-brief":"CeX 早安",
  "ai-research-daily":"AI 工具日報",
  "health-monitor":"系統檢查",
  "memory-audit-weekly":"記憶審計",
  "weekly-maintenance":"每週維修",
  "snkrdunk-watch":"SNKRDUNK 卡價",
  "samsung-watch":"Samsung 監控",
  "life-log-nightly":"生活記錄",
  "trending-politics":"熱點",
};

const labelOf = c => LABEL[c] || c || "其他";
const colorOf = c => COLOR[c] || "var(--accent)";

function ago(ts){
  if(!ts) return "";
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return "剛剛";
  if (s < 3600) return Math.floor(s/60) + " 分鐘前";
  if (s < 86400) return Math.floor(s/3600) + " 小時前";
  if (s < 2592000) return Math.floor(s/86400) + " 天前";
  return new Date(ts*1000).toLocaleDateString("zh-TW",{month:"numeric",day:"numeric"});
}

function favicon(link){
  try { return "https://www.google.com/s2/favicons?sz=64&domain=" + new URL(link).hostname; }
  catch(e){ return ""; }
}

/* ── 卡片：一則新聞一張卡 ── */
function storyHTML(d, hero){
  const color = colorOf(d.cat);
  const title = NOTES[d.link] || d.zh || d.title || "";
  const showOrig = !!(NOTES[d.link] || d.zh);
  const fav = favicon(d.link);
  const hasImg = !!d.img;
  const cls = "story" + (hero ? " hero" : "") + (hasImg ? "" : " plain");
  return `
  <a class="${cls}" href="${esc(d.link)}" data-link="${esc(d.link)}"
     rel="noopener" style="--accent:${color}">
    ${hasImg ? `<div class="thumb"><img src="${esc(d.img)}" loading="lazy" referrerpolicy="no-referrer"
        onerror="this.parentNode.remove()"></div>` : ""}
    <div class="body">
      <div class="t">${esc(title)}</div>
      <div class="meta">
        ${fav ? `<img class="fav" src="${esc(fav)}" loading="lazy" onerror="this.remove()">` : ""}
        <span class="src">${esc(d.source || "")}</span>
        <span class="sep">·</span>
        <span>${ago(d.ts) || esc(d.date || "")}</span>
        <span class="sep">·</span>
        <span style="color:${color}">${labelOf(d.cat)}</span>
      </div>
      ${showOrig ? "" : ""}
    </div>
  </a>`;
}

function noticesHTML(){
  if (!NOTICES.length || cat !== "all" || q) return "";
  const first = NOTICES[0];
  const names = NOTICES.map(n => JOBNAME[n.job] || n.job);
  const uniq = [...new Set(names)].slice(0,3).join("｜");
  return `
  <details id="notices">
    <summary>
      <span class="dot"></span>
      <span class="nt1">今天收到 ${NOTICES.length} 則</span>
      <span class="nsub">${esc(uniq)}${names.length>3?"…":""}</span>
    </summary>
    <div class="nlist">
      ${NOTICES.map(n => `
        <div class="nitem">
          <div class="nh">${esc(JOBNAME[n.job] || n.job)} · ${ago(n.ts)}</div>
          <div class="nt">${esc(n.text)}</div>
        </div>`).join("")}
    </div>
  </details>`;
}

function render(){
  const match = d => (cat === "all" || d.cat === cat) &&
    (!q || ((NOTES[d.link]||"") + " " + (d.title||"") + " " + (d.source||"")).toLowerCase().includes(q));

  const picks = PICKS.filter(match);
  const hero = picks.slice(0, 3);                 // 上面三則做重點（有大標）
  const rest = ALL.filter(match).filter(d => !hero.some(h => h.link === d.link));

  const list = $("#list");
  if (!hero.length && !rest.length){
    list.innerHTML = `<div class="msg">${q ? "找不到「"+esc(q)+"」" : "沒有符合的"}</div>`;
    return;
  }

  let html = noticesHTML();

  if (hero.length){
    html += `<div class="sect"><h2>${(q||cat!=="all")?"符合":"重點"}</h2>
             <span>${hero.length} 則</span></div>`;
    hero.forEach((d,i) => { html += storyHTML(d, i === 0 && !q && cat === "all"); });
  }

  if (rest.length){
    html += `<div class="sect"><h2>${(q||cat!=="all")?"其他":"更多"}</h2>
             <span>${rest.length} 則</span></div>`;
    rest.forEach(d => { html += storyHTML(d, false); });
  }

  list.innerHTML = html;
}

function buildTabs(){
  const nav = $("#tabs");
  nav.innerHTML = "";
  CATS.forEach(([k, label]) => {
    const n = k === "all" ? ALL.length : ALL.filter(d => d.cat === k).length;
    if (!n && k !== "all") return;
    const b = document.createElement("button");
    b.className = "tab" + (k === cat ? " on" : "");
    b.textContent = `${label} ${n}`;
    b.onclick = () => { cat = k; buildTabs(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(b);
  });
}

/* ── 閱讀模式 ── */
function openReader(d){
  if (!d) return;
  $("#rsrc").textContent = (d.source||"") + " · " + (ago(d.ts) || d.date || "");
  const title = NOTES[d.link] || d.zh || d.title || "";
  const orig = (NOTES[d.link] || d.zh) ? d.title : "";
  const body = d.full
    ? `<div class="rtext">${d.full.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`
    : `<div class="rnone">這條沒抓到正文，只有摘要：</div>
       <div class="rtext"><p>${esc(d.summary || d.title || "")}</p></div>`;
  $("#rbody").innerHTML = `
    <h2>${esc(title)}</h2>
    ${orig ? `<div class="rorig">${esc(orig)}</div>` : ""}
    ${body}
    <a class="ropen" href="${esc(d.link)}" target="_blank" rel="noopener">看原文 ↗</a>`;
  $("#reader").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeReader(){
  $("#reader").classList.remove("on");
  document.body.style.overflow = "";
}

document.addEventListener("click", e => {
  const a = e.target.closest("a.story");
  if (!a) return;
  const d = BYLINK[a.dataset.link];
  if (!d) return;
  e.preventDefault();
  openReader(d);
});
$("#rclose").onclick = closeReader;
$("#q").oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };

async function load(){
  try {
    const r = await fetch("items.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();

    let feed = null;
    try {
      const fr = await fetch("feed.json?t=" + Date.now(), {cache:"no-store"});
      if (fr.ok){ const arr = await fr.json(); if (Array.isArray(arr) && arr.length) feed = new Set(arr); }
    } catch(e){}

    NOTES = {};
    try {
      const nr = await fetch("notes.json?t=" + Date.now(), {cache:"no-store"});
      if (nr.ok){ const o = await nr.json(); if (o && typeof o === "object") NOTES = o; }
    } catch(e){}

    NOTICES = [];
    try {
      const tr = await fetch("notices.json?t=" + Date.now(), {cache:"no-store"});
      if (tr.ok){ const a = await tr.json(); if (Array.isArray(a)) NOTICES = a; }
    } catch(e){}

    ALL = (j.items || [])
      .filter(d => !feed || feed.has(d.link))
      .sort((a,b) => (b.ts||0) - (a.ts||0));

    PICKS = (j.picks && j.picks.length) ? j.picks.slice() : ALL.slice(0, 12);
    if (feed) {
      PICKS = PICKS.filter(d => feed.has(d.link));
      if (PICKS.length < 3) PICKS = ALL.slice(0, 6);
    }
    PICKS = PICKS.map(d => d).sort((a,b) => (b.ts||0) - (a.ts||0));

    CATS = j.cats || [];
    BYLINK = {};
    ALL.forEach(d => BYLINK[d.link] = d);
    PICKS.forEach(d => BYLINK[d.link] = d);

    const now = new Date();
    const wd = ["日","一","二","三","四","五","六"][now.getDay()];
    $("#today").textContent = `${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${wd}`;
    $("#meta").textContent = `${ALL.length} 則` +
      (j.generated_at ? " · " + (ago(Date.parse(j.generated_at)/1000) || "剛剛") + "更新" : "");

    buildTabs();
    render();
  } catch(e){
    if (!ALL.length) $("#list").innerHTML =
      '<div class="msg">拿不到資料<br>確認一下網路，或等下次更新</div>';
    $("#meta").textContent = "離線 · 顯示上次資料";
  }
}

load();
</script>
</body>
</html>
