<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今天</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#07080a; --card:#101216; --card2:#15181e; --line:rgba(255,255,255,.07);
  --fg:#f0f2f6; --dim:#8b93a3; --dim2:#5c6373; --hot:#7aa2ff;
  --game:#fb923c; --tech:#60a5fa; --local:#34d399; --image:#a78bfa;
  --pipeline:#f472b6; --hermes:#22d3ee; --toy:#e879f9; --hype:#facc15;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Noto Sans TC",sans-serif;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain}

header{position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(7,8,10,.98) 50%,rgba(7,8,10,.9) 80%,transparent);
  backdrop-filter:blur(16px);padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.03em;
  background:linear-gradient(96deg,#f0f2f6 20%,#93b0ff 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#meta{color:var(--dim2);font-size:11.5px;font-variant-numeric:tabular-nums}
#today{color:var(--dim);font-size:12px;margin:0 0 10px}
#q{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);color:var(--fg);font-size:16px;outline:none;
  transition:.15s;font-family:inherit}
#q::placeholder{color:var(--dim2)}
#q:focus{border-color:rgba(122,162,255,.5);background:rgba(255,255,255,.06)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
button.tab{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:.15s;font-family:inherit}
button.tab.on{background:var(--fg);border-color:var(--fg);color:#07080a;font-weight:700}

main{padding:4px 14px 20px;max-width:720px;margin:0 auto}

.sect{display:flex;align-items:baseline;gap:8px;margin:18px 2px 10px}
.sect h2{font-size:12.5px;margin:0;font-weight:750;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
.sect span{font-size:11px;color:var(--dim2)}

/* ── 第一條：大卡，圖有硬上限（他說的「有些明顯太大」）── */
.hero{display:block;text-decoration:none;color:inherit;margin-bottom:11px;
  background:var(--card);border:1px solid var(--line);border-radius:19px;
  overflow:hidden;transition:transform .12s}
.hero:active{transform:scale(.985)}
.hero .thumb{position:relative;height:190px;max-height:190px;overflow:hidden;background:var(--card2)}
.hero .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hero .thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,18,22,0) 42%,rgba(16,18,22,.96) 100%)}
.hero .body{padding:0 16px 15px;margin-top:-38px;position:relative;z-index:2}
.hero .t{font-size:18.5px;font-weight:750;line-height:1.36;letter-spacing:-.02em;margin:0 0 5px}
.hero .s{font-size:12.5px;color:var(--dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero.nopic{border-left:3px solid var(--accent,var(--hot))}
.hero.nopic .body{margin-top:0;padding-top:15px}

/* ── 其餘：左圖右文，圖只有 84px，不搶版面 ── */
.card{display:flex;align-items:stretch;text-decoration:none;color:inherit;
  margin-bottom:8px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;transition:transform .12s,border-color .15s}
.card:active{transform:scale(.988);border-color:rgba(255,255,255,.16)}
.card .thumb{flex:0 0 84px;width:84px;overflow:hidden;background:var(--card2);
  position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;
  position:absolute;inset:0}
.card .body{flex:1;min-width:0;padding:10px 12px 11px}
.card .row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);
  margin-bottom:5px;flex-wrap:wrap}
.card .t{font-size:14.5px;font-weight:650;line-height:1.38;letter-spacing:-.01em;margin:0}
.card .s{font-size:12px;color:var(--dim);line-height:1.45;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.nopic{border-left:3px solid var(--accent,var(--hot))}

.src{font-weight:700;color:var(--fg);opacity:.9}
.chip{border-radius:5px;padding:1px 5px;font-size:10px;font-weight:650;
  border:1px solid currentColor}
.dot{width:3px;height:3px;border-radius:50%;background:var(--dim2)}

details{margin-top:20px;border-top:1px solid var(--line);padding-top:4px}
summary{cursor:pointer;list-style:none;padding:12px 2px;font-size:13px;
  color:var(--dim);font-weight:600;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-left:auto;transition:transform .2s;color:var(--dim2)}
details[open] summary::after{transform:rotate(180deg)}

.msg{color:var(--dim2);text-align:center;padding:56px 20px;font-size:13.5px;line-height:1.8}
#pull{position:fixed;left:50%;transform:translateX(-50%) translateY(-8px);
  top:calc(6px + env(safe-area-inset-top));background:rgba(22,25,32,.95);
  border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;
  color:var(--dim);opacity:0;pointer-events:none;transition:.18s;z-index:30}
#pull.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 閱讀模式：同一頁展開，不跳出去 ── */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  will-change:transform;visibility:hidden}
#reader.on{transform:none;visibility:visible}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(7,8,10,.99) 60%,rgba(7,8,10,.86));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.rbar button{border:0;background:rgba(255,255,255,.07);color:var(--fg);
  width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;
  cursor:pointer;flex:0 0 auto;font-family:inherit}
.rbar .rsrc{font-size:12px;color:var(--dim);font-weight:600}
.rwrap{max-width:680px;margin:0 auto;padding:16px 18px calc(48px + env(safe-area-inset-bottom))}
.rwrap h2{font-size:22px;line-height:1.38;letter-spacing:-.02em;margin:0 0 8px;font-weight:760}
.rmeta{font-size:11.5px;color:var(--dim2);margin-bottom:14px}
.rimg{width:100%;max-height:32vh;object-fit:cover;border-radius:13px;
  margin:0 0 16px;display:block;background:var(--card2)}
.rtext{font-size:16px;line-height:1.78;color:#dfe3ea;letter-spacing:.01em}
.rtext p{margin:0 0 15px}
.rtext p:first-child::first-letter{font-size:1em}
.rnone{color:var(--dim2);font-size:13.5px;line-height:1.7;
  padding:14px;border:1px dashed var(--line);border-radius:12px;margin-bottom:16px}
.rorig{display:block;text-align:center;margin-top:22px;padding:13px;
  border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--hot);text-decoration:none;font-size:13.5px;font-weight:600}
.rorig:active{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>今天</h1><span id="meta">載入中…</span></div>
  <p id="today"></p>
  <input id="q" placeholder="搜尋標題或來源…" autocomplete="off" enterkeyhint="search">
  <nav id="tabs"></nav>
</header>
<div id="pull">放開以更新</div>
<main id="list"><div class="msg">載入中…</div></main>

<div id="reader">
  <div class="rbar">
    <button id="rclose" aria-label="關閉">✕</button>
    <span class="rsrc" id="rsrc"></span>
  </div>
  <div class="rwrap" id="rbody"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let PICKS = [], ALL = [], CATS = [], cat = "all", q = "", BYLINK = {};

const COLOR = {game:"var(--game)",tech:"var(--tech)",local:"var(--local)",
               image:"var(--image)",pipeline:"var(--pipeline)",hermes:"var(--hermes)",
               toy:"var(--toy)",hype:"var(--hype)"};

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function ago(ts){
  if(!ts) return "";
  const h = (Date.now()/1000 - ts)/3600;
  if (h < 1) return Math.max(1, Math.round(h*60)) + " 分鐘前";
  if (h < 24) return Math.round(h) + " 小時前";
  if (h < 168) return Math.round(h/24) + " 天前";
  return "";
}
function labelOf(c){ const m = CATS.find(x => x[0] === c); return m ? m[1] : c; }

function cardHTML(d, hero){
  const color = COLOR[d.cat] || "var(--hot)";
  const cls = hero ? "hero" : "card";
  const thumb = d.img
    ? `<div class="thumb"><img src="${esc(d.img)}" loading="lazy" referrerpolicy="no-referrer"
           onerror="this.parentNode.style.display='none'"></div>` : "";
  const noPic = d.img ? "" : " nopic";
  return `
  <a class="${cls}${noPic}" href="${esc(d.link)}" data-link="${esc(d.link)}"
     rel="noopener" style="--accent:${color}">
    ${thumb}
    <div class="body">
      <div class="row">
        <span class="src">${esc(d.source)}</span>
        <span class="chip" style="color:${color}">${labelOf(d.cat)}</span>
        <span class="dot"></span><span>${ago(d.ts) || esc(d.date)}</span>
      </div>
      <div class="t">${esc(d.title)}</div>
      ${(!hero && d.summary) ? `<div class="s">${esc(d.summary)}</div>` : ""}
      ${hero && d.summary ? `<div class="s">${esc(d.summary)}</div>` : ""}
    </div>
  </a>`;
}

function render(){
  const match = d => (cat === "all" || d.cat === cat) &&
    (!q || (d.title + " " + d.source).toLowerCase().includes(q));

  const picks = PICKS.filter(match);
  const restOnly = ALL.filter(match).filter(r => !PICKS.some(p => p.link === r.link));

  const list = $("#list");
  if (!picks.length && !restOnly.length){
    list.innerHTML = '<div class="msg">沒有符合的</div>'; return;
  }

  let html = "";
  if (picks.length){
    html += `<div class="sect"><h2>${(q || cat !== "all") ? "符合" : "今天值得看"}</h2>
             <span>${picks.length} 條</span></div>`;
    picks.forEach((d, i) => { html += cardHTML(d, i === 0 && !q && cat === "all"); });
  }
  if (restOnly.length){
    html += `<details ${(q || cat !== "all") ? "open" : ""}>
      <summary>全部 ${restOnly.length} 條</summary>
      ${restOnly.map(d => cardHTML(d, false)).join("")}
    </details>`;
  }
  list.innerHTML = html;
}

function buildTabs(){
  const nav = $("#tabs");
  nav.innerHTML = "";
  CATS.forEach(([k, label]) => {
    const n = k === "all" ? PICKS.length : PICKS.filter(d => d.cat === k).length;
    if (!n && k !== "all") return;
    const b = document.createElement("button");
    b.className = "tab" + (k === cat ? " on" : "");
    b.textContent = `${label} ${n}`;
    b.onclick = () => { cat = k; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

/* ── 閱讀模式 ── */
function openReader(d){
  if (!d) return;
  $("#rsrc").textContent = d.source + " · " + (ago(d.ts) || d.date || "");
  const body = d.full
    ? `<div class="rtext">${d.full.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</div>`
    : `<div class="rnone">這條沒抓到正文（${esc(d.source)} 可能有反爬），只有摘要。
         想看全文請點最底下的按鈕。</div>
       <div class="rtext"><p>${esc(d.summary || d.title)}</p></div>`;
  $("#rbody").innerHTML = `
    <h2>${esc(d.title)}</h2>
    <div class="rmeta">${labelOf(d.cat)} · ${esc(d.date || "")}</div>
    ${d.img ? `<img class="rimg" src="${esc(d.img)}" referrerpolicy="no-referrer"
         onerror="this.style.display='none'">` : ""}
    ${body}
    <a class="rorig" href="${esc(d.link)}" target="_blank" rel="noopener">讀原文 →</a>`;
  const el = $("#reader");
  el.classList.add("on");
  el.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (!history.state || !history.state.reader) history.pushState({reader:1}, "");
}
function closeReader(){
  const el = $("#reader");
  if (!el.classList.contains("on")) return;
  el.classList.remove("on");
  document.body.style.overflow = "";
  if (history.state && history.state.reader) history.back();
}
$("#rclose").onclick = closeReader;
addEventListener("popstate", () => {
  if ($("#reader").classList.contains("on")) closeReader();
});

/* 點卡片 → 頁內閱讀，不跳走。長按仍可複製連結（href 保留）。 */
document.addEventListener("click", e => {
  if (e.target.closest(".rorig") || e.target.closest(".rbar")) return;
  const a = e.target.closest("a[data-link]");
  if (!a) return;
  const d = BYLINK[a.dataset.link];
  if (!d) return;                       // 找不到就照常跳轉
  e.preventDefault();
  openReader(d);
});

async function load(bust){
  try {
    const r = await fetch("items.json" + (bust ? "?t=" + Date.now() : ""), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    ALL = j.items || [];
    PICKS = (j.picks && j.picks.length) ? j.picks : ALL.slice(0, 15);
    CATS = j.cats || [];
    BYLINK = {};
    ALL.forEach(d => { BYLINK[d.link] = d; });
    PICKS.forEach(d => { BYLINK[d.link] = d; });   // picks 帶 full，優先
    const d = new Date();
    const wd = ["日","一","二","三","四","五","六"][d.getDay()];
    $("#today").textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${wd}`;
    $("#meta").textContent = `${PICKS.length} 條` +
      (j.generated_at ? " · " + (ago(Date.parse(j.generated_at)/1000) || "剛剛") + "更新" : "");
    buildTabs(); render();
  } catch (e) {
    if (!ALL.length) $("#list").innerHTML =
      '<div class="msg">拿不到資料<br>請確認網路，或等下一次更新</div>';
    $("#meta").textContent = "離線 · 顯示上次資料";
  }
}

$("#q").oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };

let y0 = null, pulled = false;
addEventListener("touchstart", e => {
  if ($("#reader").classList.contains("on")) return;
  y0 = scrollY <= 2 ? e.touches[0].clientY : null; pulled = false;
}, {passive:true});
addEventListener("touchmove", e => {
  if (y0 === null) return;
  if (e.touches[0].clientY - y0 > 72 && !pulled){ pulled = true; $("#pull").classList.add("on"); }
}, {passive:true});
addEventListener("touchend", () => {
  if (pulled){ $("#pull").classList.remove("on"); load(true); }
  y0 = null;
});
addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

load(false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
