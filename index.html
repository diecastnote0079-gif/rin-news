<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>凜的新聞台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#08090b; --card:#101216; --card2:#15181e; --line:rgba(255,255,255,.075);
  --fg:#eef1f6; --dim:#8a92a3; --dim2:#5f6675; --hot:#7aa2ff;
  --c-image:#a78bfa; --c-local:#34d399; --c-agent:#60a5fa; --c-pipeline:#fb923c;
  --c-model:#f472b6; --c-hermes:#22d3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Noto Sans TC",sans-serif;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain}

header{position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(8,9,11,.97) 55%,rgba(8,9,11,.88) 82%,rgba(8,9,11,0));
  backdrop-filter:blur(14px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 9px}
.brand{display:flex;align-items:baseline;gap:9px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(92deg,#eef1f6,#9fb6ff 75%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#meta{color:var(--dim2);font-size:11.5px}
#q{width:100%;margin-top:11px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);
  font-size:16px;outline:none;transition:border-color .15s,background .15s;font-family:inherit}
#q::placeholder{color:var(--dim2)}
#q:focus{border-color:rgba(122,162,255,.55);background:rgba(255,255,255,.06)}
nav{display:flex;gap:7px;overflow-x:auto;padding:11px 0 1px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
button.tab{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--dim);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:.15s;font-family:inherit}
button.tab.on{background:var(--fg);border-color:var(--fg);color:#0a0b0d;font-weight:700}

main{padding:6px 14px 20px;max-width:760px;margin:0 auto}

.card{display:block;text-decoration:none;color:inherit;margin-bottom:11px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;transition:transform .12s,border-color .15s}
.card:active{transform:scale(.985);border-color:rgba(255,255,255,.16)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--card2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,18,22,0) 42%,rgba(16,18,22,.97) 100%)}
.body{padding:12px 14px 14px}
.card.has-thumb .body{padding-top:0;margin-top:-30px;position:relative;z-index:2}
.row{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:11px;
  color:var(--dim);flex-wrap:wrap}
.src{font-weight:700;color:var(--fg);opacity:.9}
.chip{border-radius:6px;padding:1.5px 6px;font-size:10.5px;font-weight:600;
  border:1px solid currentColor}
.dot{width:3px;height:3px;border-radius:50%;background:var(--dim2)}
.t{font-size:16px;font-weight:650;line-height:1.38;letter-spacing:-.01em;margin:0 0 5px}
.s{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.card.no-thumb{border-left:3px solid var(--accent,var(--hot))}

.msg{color:var(--dim2);text-align:center;padding:56px 20px;font-size:13.5px;line-height:1.7}
#pull{position:fixed;left:50%;transform:translateX(-50%) translateY(-6px);
  top:calc(6px + env(safe-area-inset-top));background:rgba(22,25,32,.94);
  border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;
  color:var(--dim);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30}
#pull.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>凜的新聞台</h1><span id="meta">載入中…</span></div>
  <input id="q" placeholder="搜尋標題或來源…" autocomplete="off" enterkeyhint="search">
  <nav id="tabs"></nav>
</header>
<div id="pull">放開以更新</div>
<main id="list"><div class="msg">載入中…</div></main>

<script>
const $ = s => document.querySelector(s);
let DATA = [], CATS = [], cat = "all", q = "";

const COLOR = {image:"var(--c-image)",local:"var(--c-local)",agent:"var(--c-agent)",
               pipeline:"var(--c-pipeline)",model:"var(--c-model)",hermes:"var(--c-hermes)"};

function esc(s){
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function ago(ts){
  if(!ts) return "";
  const h = (Date.now()/1000 - ts)/3600;
  if (h < 1) return Math.max(1, Math.round(h*60)) + " 分鐘前";
  if (h < 24) return Math.round(h) + " 小時前";
  if (h < 168) return Math.round(h/24) + " 天前";
  return "";
}
function labelOf(c){ const m = CATS.find(x => x[0] === c); return m ? m[1] : c; }

function render(){
  const rows = DATA.filter(d =>
    (cat === "all" || d.cat === cat) &&
    (!q || (d.title + " " + d.source).toLowerCase().includes(q)));
  const list = $("#list");
  if (!rows.length){ list.innerHTML = '<div class="msg">沒有符合的</div>'; return; }
  list.innerHTML = rows.map(d => {
    const color = COLOR[d.cat] || "var(--hot)";
    const thumb = d.img
      ? `<div class="thumb"><img src="${esc(d.img)}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.parentNode.remove()"></div>` : "";
    return `
    <a class="card ${d.img ? "has-thumb" : "no-thumb"}" href="${esc(d.link)}" target="_blank"
       rel="noopener" style="--accent:${color}">
      ${thumb}
      <div class="body">
        <div class="row">
          <span class="src">${esc(d.source)}</span>
          <span class="chip" style="color:${color}">${labelOf(d.cat)}</span>
          <span class="dot"></span><span>${ago(d.ts) || esc(d.date)}</span>
        </div>
        <div class="t">${esc(d.title)}</div>
        ${d.summary ? `<div class="s">${esc(d.summary)}</div>` : ""}
      </div>
    </a>`;
  }).join("");
}

function buildTabs(){
  const nav = $("#tabs");
  nav.innerHTML = "";
  CATS.forEach(([k, label]) => {
    const n = k === "all" ? DATA.length : DATA.filter(d => d.cat === k).length;
    if (!n && k !== "all") return;
    const b = document.createElement("button");
    b.className = "tab" + (k === cat ? " on" : "");
    b.textContent = `${label} ${n}`;
    b.onclick = () => { cat = k; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

async function load(bust){
  try {
    const r = await fetch("items.json" + (bust ? "?t=" + Date.now() : ""), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    DATA = j.items || []; CATS = j.cats || [];
    $("#meta").textContent = DATA.length + " 條" +
      (j.generated_at ? " · " + ago(Date.parse(j.generated_at)/1000) + "更新" : "");
    buildTabs(); render();
  } catch (e) {
    if (!DATA.length) $("#list").innerHTML =
      '<div class="msg">拿不到資料<br>請確認網路，或等下一次更新</div>';
    $("#meta").textContent = "離線 · 顯示上次資料";
  }
}

$("#q").oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };

// 手機下拉更新
let y0 = null, pulled = false;
addEventListener("touchstart", e => {
  y0 = scrollY <= 2 ? e.touches[0].clientY : null; pulled = false;
}, {passive:true});
addEventListener("touchmove", e => {
  if (y0 === null) return;
  if (e.touches[0].clientY - y0 > 72 && !pulled){ pulled = true; $("#pull").classList.add("on"); }
}, {passive:true});
addEventListener("touchend", () => {
  if (pulled){ $("#pull").classList.remove("on"); load(true); }
  y0 = null;
});

load(false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
