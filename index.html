<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>凜的新聞台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a3;--hot:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.55 -apple-system,"Segoe UI",system-ui,"Noto Sans TC",sans-serif;
     padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.bar{display:flex;align-items:baseline;gap:8px}
h1{font-size:16px;margin:0;font-weight:600}
#meta{color:var(--dim);font-size:11.5px}
#q{width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
   background:#12151b;color:var(--fg);font-size:15px;outline:none}
#q:focus{border-color:var(--hot)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
button.tab{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
           background:transparent;color:var(--dim);font-size:13px;cursor:pointer}
button.tab.on{background:var(--hot);border-color:var(--hot);color:#0b0d11;font-weight:600}
main{padding:10px 12px 28px;max-width:820px;margin:0 auto}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
       border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px}
a.card:active{border-color:#3b4557}
.row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.src{color:var(--hot);font-weight:600}
.cat{border:1px solid var(--line);border-radius:5px;padding:0 5px}
.t{font-size:15px;font-weight:600;line-height:1.42;margin:2px 0 5px}
.s{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;
   -webkit-box-orient:vertical;overflow:hidden}
.msg{color:var(--dim);text-align:center;padding:48px 16px;font-size:13.5px}
#pull{position:fixed;left:50%;transform:translateX(-50%);top:-44px;background:var(--card);
      border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:12.5px;
      color:var(--dim);transition:top .2s;z-index:9}
#pull.on{top:calc(8px + env(safe-area-inset-top))}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>凜的新聞台</h1><span id="meta">載入中…</span></div>
  <input id="q" placeholder="搜尋標題或來源…" autocomplete="off">
  <nav id="tabs"></nav>
</header>
<div id="pull">放開以更新</div>
<main id="list"><div class="msg">載入中…</div></main>

<script>
const $ = s => document.querySelector(s);
let DATA = [], CATS = [], cat = "all", q = "";

function ago(utc){
  if(!utc) return "";
  const h = (Date.now() - new Date(utc).getTime())/36e5;
  if (h < 1) return Math.max(1, Math.round(h*60)) + " 分鐘前";
  if (h < 24) return Math.round(h) + " 小時前";
  return Math.round(h/24) + " 天前";
}
function labelOf(c){ const m = CATS.find(x => x[0] === c); return m ? m[1] : c; }

function render(){
  const rows = DATA.filter(d =>
    (cat === "all" || d.cat === cat) &&
    (!q || (d.title + " " + d.source).toLowerCase().includes(q)));
  const list = $("#list");
  if (!rows.length){ list.innerHTML = '<div class="msg">沒有符合的</div>'; return; }
  list.innerHTML = rows.map(d => `
    <a class="card" href="${d.link}" target="_blank" rel="noopener">
      <div class="row"><span class="src">${d.source}</span>
        <span class="cat">${labelOf(d.cat)}</span>
        <span>${d.date || ""}</span><span>${d.ts ? ago(new Date(d.ts*1000).toISOString()) : ""}</span></div>
      <div class="t">${d.title}</div>
      ${d.summary ? `<div class="s">${d.summary}</div>` : ""}
    </a>`).join("");
}

function buildTabs(){
  const nav = $("#tabs");
  nav.innerHTML = "";
  CATS.forEach(([k, label]) => {
    const n = k === "all" ? DATA.length : DATA.filter(d => d.cat === k).length;
    if (!n && k !== "all") return;
    const b = document.createElement("button");
    b.className = "tab" + (k === cat ? " on" : "");
    b.textContent = `${label} ${n}`;
    b.onclick = () => { cat = k; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

async function load(bust){
  try {
    const r = await fetch("items.json" + (bust ? "?t=" + Date.now() : ""), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    DATA = j.items || [];
    CATS = j.cats || [];
    $("#meta").textContent = DATA.length + " 條" + (j.generated_at ? " · " + ago(j.generated_at) + "更新" : "");
    buildTabs(); render();
  } catch (e) {
    if (!DATA.length) $("#list").innerHTML =
      '<div class="msg">拿不到 items.json<br>請確認網路，或等下一次抓取</div>';
    $("#meta").textContent = "離線 · 顯示上次資料";
  }
}

$("#q").oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };

// 手機下拉更新
let y0 = null, pulled = false;
addEventListener("touchstart", e => { y0 = scrollY === 0 ? e.touches[0].clientY : null; pulled = false; }, {passive:true});
addEventListener("touchmove", e => {
  if (y0 === null) return;
  if (e.touches[0].clientY - y0 > 70 && !pulled){ pulled = true; $("#pull").classList.add("on"); }
}, {passive:true});
addEventListener("touchend", () => {
  if (pulled){ $("#pull").classList.remove("on"); load(true); }
  y0 = null;
});

load(false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
