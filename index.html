<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0C0B0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>早報</title>
<style>
:root{
  --bg:#0b0c0f; --surface:#15171c; --surface2:#1c1f26; --line:#262a32;
  --fg:#eceae6;
  /* 三階文字：主要 / 次要 / 輔助（輔助也維持 WCAG AA） */
  --dim:#9aa0a8; --dim2:#7d848c;
  /* 顏色只有三個用途：藍=可點、橘=將到期、紅=異常 */
  --accent:#8ab4f8; --warn:#e0a45c; --hot:#f2837a;
  --game:#8fbf9f; --toy:#c9a184; --tech:#a9a2c4;
  --tabh:58px;
  /* 間距：8 的倍數 */
  --s1:8px; --s2:16px; --s3:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Samsung One",system-ui,"Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* ── 頁面 ── */
.page{display:none}
.page.on{display:block}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:20;background:rgba(11,12,15,.92);
  backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid transparent;
  padding:calc(10px + env(safe-area-inset-top)) 18px 0;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;min-height:34px}
h1{font-size:25px;font-weight:700;letter-spacing:-.025em}
.hmeta{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--dim);margin-top:1px;margin-bottom:10px}

/* 搜尋 */
#q{width:100%;padding:10px 14px 10px 34px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);font-size:14px;font-family:inherit;outline:none}
#q:focus{border-color:#39404d}
#q::placeholder{color:var(--dim2)}

/* chips */

/* ── 手勢：下拉刷新指示 ── */
#ptr{position:fixed;left:50%;top:0;z-index:70;width:32px;height:32px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--accent);
  transform:translate(-50%,-50px);opacity:0;
  transition:transform .16s ease, opacity .16s ease;pointer-events:none}
#ptr.show{opacity:1}
#ptr.spin{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
html{overscroll-behavior-y:contain}

/* ── 今日新聞摘要 ── */
.digest{padding:6px 0 4px}
.digest .dh{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--fg);
  margin:16px 0 9px}
.digest .dh:first-child{margin-top:4px}
.digest .dp{font-size:14px;line-height:1.7;color:var(--dim);margin:4px 0}
.digest ul{list-style:none;padding:0;margin:0 0 6px}
.digest li{position:relative;padding-left:15px;font-size:14.5px;line-height:1.66;
  color:var(--fg);margin-bottom:7px}
.digest li::before{content:"";position:absolute;left:3px;top:10px;width:4px;height:4px;
  border-radius:50%;background:var(--dim2)}
.digest li:last-child{margin-bottom:0}
.digest .dli{display:block;color:inherit;text-decoration:none}
.digest .dli:active{opacity:.6}
.digest .dls{display:block;font-size:11px;color:var(--dim2);margin-top:3px;
  font-variant-numeric:tabular-nums}

/* ── 遊戲／科技新聞頁 ── */
.gnwrap{padding:2px 0 8px}
.gnh{font-size:12.5px;color:var(--dim2);letter-spacing:.03em;padding:10px 0 12px}
.gni{padding:13px 14px;background:var(--surface);border-radius:12px;margin-bottom:9px}
.gnt{font-size:15px;font-weight:600;line-height:1.45;color:var(--fg)}
.gnn{font-size:13.5px;line-height:1.62;color:var(--dim);margin-top:5px}
.gns{font-size:11px;color:var(--dim2);margin-top:7px;font-variant-numeric:tabular-nums}
.gntag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
  background:rgba(143,191,159,.14);color:var(--game);margin-right:6px;vertical-align:1px;font-weight:600}
.gntag.tech{background:rgba(169,162,196,.14);color:var(--tech)}

/* ── 首頁底部：今天收到（摺疊）── */
.nf{margin:18px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);padding-top:2px}
.nf>summary{list-style:none;cursor:pointer;padding:13px 0;font-size:12.5px;color:var(--dim2);
  display:flex;align-items:center;gap:7px}
.nf>summary::-webkit-details-marker{display:none}
.nf>summary::after{content:"▾";margin-left:auto;opacity:.6}
.nf[open]>summary::after{content:"▴"}
.nf .nfl{padding-bottom:8px}
.nf .ni{padding:11px 13px;background:var(--surface);border-radius:11px;margin-bottom:8px}
.nf .nh{font-size:10.5px;color:var(--dim2);letter-spacing:.04em;margin-bottom:4px}
.nf .nb{font-size:13px;line-height:1.62;color:var(--dim);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nf .ni.open .nb{display:block;-webkit-line-clamp:unset;overflow:visible}
.nf .nb b{color:var(--fg);font-weight:600}
.nf .nb code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(255,255,255,.06);
  padding:1px 5px;border-radius:5px;color:var(--accent)}
.nf .nb .nh2{font-size:13px;font-weight:700;color:var(--fg);margin:9px 0 5px}
.nf .nb .nh2:first-child{margin-top:0}
.nf .nb .np{margin:3px 0;color:var(--dim)}
.nf .nb .nl{list-style:none;padding:0;margin:3px 0 6px}
.nf .nb .nl li{position:relative;padding-left:13px;margin-bottom:4px;color:var(--fg)}
.nf .nb .nl li::before{content:"";position:absolute;left:2px;top:9px;width:3px;height:3px;
  border-radius:50%;background:var(--dim2)}
.nf .nb .nrow{display:flex;gap:7px;align-items:flex-start;margin:4px 0}
.nf .nb .nem{flex:0 0 auto;font-size:12.5px;line-height:1.5}
.nf .nb .ntx{flex:1;color:var(--fg)}
.nf .nb .nlab{flex:0 0 auto;font-size:10.5px;line-height:1.5;padding:1px 7px;border-radius:6px;
  background:rgba(138,180,248,.12);color:var(--accent);margin-top:1px;white-space:nowrap}

/* ── 提醒跑馬燈 ── */
.reminder{overflow:hidden;white-space:nowrap;padding:0 0 7px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.reminder .track{display:inline-block;white-space:nowrap;font-size:11.5px;line-height:1.4;
  animation:marquee 24s linear infinite;color:#ffb86b}
.reminder.slow .track{animation-duration:40s}
.reminder .ri{display:inline-block;margin-right:7px;padding:2px 9px;border-radius:99px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
  color:var(--dim);font-size:11.5px}
.reminder .ri:has(.soon){background:rgba(224,164,92,.10);border-color:rgba(224,164,92,.20);
  color:#cbb69a}
.reminder .ri .d{color:var(--dim2);margin-right:4px;font-variant-numeric:tabular-nums}
.reminder .ri .soon{color:var(--warn);font-weight:600}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.reminder .track{animation:none}}

/* ── 首頁頂部壓縮 ── */
#p-home header{padding-top:calc(6px + env(safe-area-inset-top))}
#p-home .hrow{gap:10px;min-height:28px}
#p-home h1{font-size:21px;letter-spacing:-.03em}
.hdate{font-size:12px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
#p-home .hmeta{font-size:11px;color:var(--dim2);margin-left:8px}
.statusline{display:flex;align-items:baseline;gap:13px;padding:5px 0 9px;overflow-x:auto;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);
  mask-image:linear-gradient(90deg,#000 94%,transparent)}
.statusline::-webkit-scrollbar{display:none}
.si{display:flex;align-items:baseline;gap:4px;flex:0 0 auto}
.si .k{font-size:9px;color:var(--dim2);letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.si .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  color:var(--dim)}
.si.warn .v{color:var(--warn)}
.si.bad .v{color:var(--hot)}

/* ── 狀態小卡（天氣式）── */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 13px}
.stat{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:13px;
  padding:10px 12px 11px;position:relative;overflow:hidden}
.stat .sl{font-size:10px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
.stat .sv{font-size:21px;font-weight:700;margin-top:1px;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .sv small{font-size:12px;font-weight:600;color:var(--dim);margin-left:1px}
.stat .ss{font-size:10px;color:var(--dim2);margin-top:2px;font-variant-numeric:tabular-nums}
.stat .g{position:absolute;right:10px;top:9px;font-size:15px;opacity:.55}
.stat.warn .sv{color:#ffb86b}
.stat.bad  .sv{color:var(--hot)}

/* ── 兩頁式：新聞 / 簡報，左右滑 ── */
#p-home{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;
  padding:0 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:5px;padding:0 0 6px;flex:0 0 auto}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--dim2);opacity:.4;transition:all .22s}
.dots i.on{opacity:1;background:#b9c0c9;width:15px;border-radius:3px}

/* 簡報卡 */
.briefwrap{padding-top:4px}
.bcard{background:var(--surface);border:1px solid rgba(255,255,255,.045);border-radius:14px;
  padding:14px 15px 15px;margin-bottom:12px}
.bh{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--fg);
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.bh .bi{font-size:14px}
.bh .bt{margin-left:auto;font-size:11px;color:var(--dim2);font-weight:400;font-variant-numeric:tabular-nums}
.bb{font-size:13.5px;line-height:1.68;color:var(--dim)}
.bb b{color:var(--fg);font-weight:600}
.bb code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(255,255,255,.06);
  padding:1px 5px;border-radius:5px;color:var(--accent)}
.bb .nh2{font-size:13.5px;font-weight:700;color:var(--fg);margin:11px 0 5px}
.bb .nh2:first-child{margin-top:0}
.bb .np{margin:3px 0}
.bb .nl{list-style:none;padding:0;margin:4px 0 7px}
.bb .nl li{position:relative;padding-left:13px;margin-bottom:4px;color:var(--fg)}
.bb .nl li::before{content:"";position:absolute;left:2px;top:9px;width:3px;height:3px;
  border-radius:50%;background:var(--dim2)}
.bb .tnode{background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.05);
  border-left:2px solid rgba(255,255,255,.09);
  border-radius:12px;padding:12px 13px 13px;margin:11px 0}
/* 結論決定左側色條：值得試=綠、觀察=灰、不用管=紅 */
.bb .tnode:has(.nlab.good){border-left-color:#7fb894}
.bb .tnode:has(.nlab.bad){border-left-color:#c9807a}
.bb .tnode:has(.nlab.meh){border-left-color:rgba(255,255,255,.14)}
.bb .tnode + .tnode{margin-top:8px}
.bb .th{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
.bb .tnum{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--dim2);
  background:rgba(255,255,255,.07);border-radius:4px;padding:1.5px 5px;line-height:1.4;
  font-variant-numeric:tabular-nums}
.bb .ttl{font-size:13.5px;font-weight:700;color:var(--fg);line-height:1.42;letter-spacing:-.005em}
.bb .tnode .nrow{margin:6px 0}
.bb .tnode .nrow:last-child{margin-bottom:0}
.bb .tnode .nlab{min-width:40px;font-size:10px}
.bb .ncat{display:flex;align-items:center;gap:8px;margin:15px 0 7px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.055)}
.bb .ncat.first{margin-top:4px;padding-top:0;border-top:0}
.bb .ncat .nem{font-size:13px;line-height:1}
.bb .ncat .nct{font-size:13px;font-weight:700;color:#f2f0ec;letter-spacing:.01em}
.bb .ncat .nct::after{content:"";flex:1}
.bb .price{color:#d8c398;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bb .arrow{color:var(--dim2);margin:0 3px;font-size:11px}
.bb .nrow{display:flex;gap:7px;align-items:flex-start;margin:5px 0}
.bb .nem{flex:0 0 auto;line-height:1.55}
.bb .ntx{flex:1}
.bb .nlab{flex:0 0 auto;font-size:10.5px;line-height:1.5;padding:1.5px 7px;border-radius:6px;
  background:rgba(255,255,255,.055);color:var(--dim2);margin-top:1px;white-space:nowrap;
  min-width:44px;text-align:center;font-weight:500}
.bb .nlab.good{background:rgba(143,191,159,.16);color:#9ecfae}
.bb .nlab.meh{background:rgba(255,255,255,.06);color:var(--dim2)}
.bb .nlab.bad{background:rgba(242,131,122,.13);color:#dfa09a}

main{padding:0}

/* ── 分段標題 ── */
.sect{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 10px}
.sect h2{font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--dim)}
.sect span{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}

/* ── 大卡（重點）── */
a.lead{display:block;text-decoration:none;color:inherit;position:relative;
  border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
a.lead .thumb{width:100%;aspect-ratio:16/10;background:var(--surface2);display:block}
a.lead .thumb img{width:100%;height:100%;object-fit:cover;display:block}
a.lead .txt{padding:var(--s2) var(--s2) var(--s2)}
a.lead .t{font-size:17px;font-weight:700;line-height:1.42;letter-spacing:-.015em;
  text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
a.lead .m{display:flex;align-items:center;gap:6px;margin-top:var(--s1);font-size:11.5px;color:var(--dim2);
  font-variant-numeric:tabular-nums}
a.lead .m .s{color:#a8aeb6;font-weight:500}

/* ── 列表卡 ── */
a.row{display:flex;gap:12px;text-decoration:none;color:inherit;padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.045)}
a.row:last-child{border-bottom:0}
a.row .txt{flex:1;min-width:0}
a.row .t{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em;
  text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
a.row .m{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--dim2);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.row .m .s{color:#a8aeb6;font-weight:500}
a.row .pic{width:78px;height:78px;border-radius:10px;overflow:hidden;background:var(--surface2);flex:0 0 auto}
a.row .pic img{width:100%;height:100%;object-fit:cover;display:block}
a.row .cat{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:rgba(255,255,255,.075);color:#b6bcc4;font-weight:500;letter-spacing:.01em}

/* ── 通知頁 ── */
.card{background:var(--surface);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.card .cn{font-size:12.5px;font-weight:600;color:var(--fg)}
.card .ct{font-size:11px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
.card .cb{font-size:13.5px;line-height:1.62;color:var(--dim);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card.open .cb{-webkit-line-clamp:unset}
.card .more{font-size:11.5px;color:var(--accent);margin-top:7px;display:inline-block}
.badge{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ── 分類頁 ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.tile{background:var(--surface);border-radius:14px;padding:16px;text-align:left;
  border:1px solid transparent;font-family:inherit;color:inherit}
.tile:active{border-color:var(--line)}
.tile .n{font-size:14.5px;font-weight:600}
.tile .c{font-size:11.5px;color:var(--dim2);margin-top:3px;font-variant-numeric:tabular-nums}
.tile .bar{height:3px;border-radius:2px;margin-bottom:10px;width:26px}

/* ── 閱讀模式 ── */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;
  touch-action:pan-y;overscroll-behavior:contain}
#reader.on{display:flex;animation:up .22s ease}
@keyframes up{from{transform:translateY(3%);opacity:.6}to{transform:none;opacity:1}}
.rbar{display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);background:rgba(11,12,15,.92);backdrop-filter:blur(18px)}
#rclose{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);
  color:var(--fg);font-size:15px;flex:0 0 auto}
.rsrc{font-size:11.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwrap{flex:1;overflow-y:auto;padding:20px 20px calc(50px + env(safe-area-inset-bottom))}
.rwrap h2{font-size:22px;line-height:1.38;letter-spacing:-.02em;font-weight:700;margin-bottom:12px}
.rorig{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);padding-left:10px;
  margin-bottom:16px;line-height:1.5}
.rtext p{font-size:15.5px;line-height:1.8;color:#d4d1cc;margin-bottom:15px}
.rnone{font-size:13px;color:var(--dim2);margin-bottom:12px}
.ropen{display:inline-block;margin-top:6px;padding:11px 17px;border-radius:11px;
  background:var(--surface2);color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:600}
/* 問凜：把這則新聞推回對話，方便追問 */
.rrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rask{margin-top:6px;padding:11px 17px;border-radius:11px;border:0;font-family:inherit;
  background:var(--accent);color:#0b0c0f;font-size:13.5px;font-weight:700}
.rask:active{opacity:.75}

.msg{padding:70px 20px;text-align:center;color:var(--dim2);font-size:13.5px;line-height:1.7}
</style>

<style id="editorial-skin">
/* ── 編輯風皮膚：只覆蓋顏色與字體，不動版面邏輯 ── */
:root{
  --bg:#0A0D10; --surface:#12171C; --surface2:#182028; --line:rgba(226,236,245,.12);
  --fg:#E8EDF2; --dim:#A8B3BE; --dim2:#74808C;
  --accent:#6FA8C7; --warn:#C9A96B; --hot:#D98A7A;
  --game:#93B8A6; --toy:#B9A18C; --tech:#A5A8C9;
  --serif:"Noto Serif TC","Songti TC",serif;
}
body{background:
  radial-gradient(120% 45% at 50% -12%, rgba(111,168,199,.06), transparent 62%),
  var(--bg)}
header{background:rgba(10,13,16,.94);border-bottom:1px solid rgba(226,236,245,.12)}
.hrow{min-height:34px;align-items:baseline}
.mast{display:none!important}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ALL = [], PICKS = [], BYLINK = {}, NOTES = {}, NOTICES = [], DIGEST = null;

const LABEL = {game:"遊戲",tech:"科技",ai:"AI",local:"本地",toy:"玩具模型",
  image:"圖像",pipeline:"工具",hermes:"Hermes",hype:"潮物",news:"新聞"};
const COLOR = {game:"var(--game)",tech:"var(--tech)",ai:"var(--tech)",local:"var(--accent)",
  toy:"var(--toy)",image:"var(--tech)",pipeline:"var(--tech)",hermes:"var(--tech)",hype:"var(--toy)"};
const JOBNAME = {
  "carousell-videogame-watch":"Carousell 上新","news-digest-evening":"今日新聞",
  "cex-morning-brief":"CeX 早安","ai-research-daily":"AI 工具日報",
  "health-monitor":"系統檢查","memory-audit-weekly":"記憶審計",
  "weekly-maintenance":"每週維修","snkrdunk-watch":"SNKRDUNK 卡價",
  "samsung-watch":"Samsung 監控","life-log-nightly":"生活記錄","trending-politics":"熱點"
};

const labelOf = c => LABEL[c] || c || "其他";
const colorOf = c => COLOR[c] || "var(--accent)";

function ago(ts){
  if(!ts) return "";
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return "剛剛";
  if (s < 3600) return Math.floor(s/60)+" 分鐘";
  if (s < 86400) return Math.floor(s/3600)+" 小時";
  if (s < 604800) return Math.floor(s/86400)+" 天";
  return new Date(ts*1000).toLocaleDateString("zh-TW",{month:"numeric",day:"numeric"});
}
const fav = l => { try { return "https://www.google.com/s2/favicons?sz=64&domain="+new URL(l).hostname; } catch(e){ return ""; } };
const titleOf = d => NOTES[d.link] || d.zh || d.title || "";

/* ── 卡片 ── */
function leadHTML(d){
  const img = d.img ? `<span class="thumb"><img src="${esc(d.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></span>` : "";
  return `<a class="lead" href="${esc(d.link)}" data-link="${esc(d.link)}" rel="noopener">
    ${img}
    <div class="txt">
      <div class="t">${esc(titleOf(d))}</div>
      <div class="m">${fav(d.link)?`<img src="${esc(fav(d.link))}" width="13" height="13" style="border-radius:3px;background:#fff" onerror="this.remove()">`:""}
        <span class="s">${esc(d.source||"")}</span><span>·</span><span>${ago(d.ts)}</span></div>
    </div>
  </a>`;
}

function rowHTML(d, showPic){
  const img = showPic && d.img ? `<span class="pic"><img src="${esc(d.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></span>` : "";
  return `<a class="row" href="${esc(d.link)}" data-link="${esc(d.link)}" rel="noopener">
    <span class="txt">
      <div class="t">${esc(titleOf(d))}</div>
      <div class="m"><span class="cat">${labelOf(d.cat)}</span><span class="s">${esc(d.source||"")}</span><span>·</span><span>${ago(d.ts)}</span></div>
    </span>${img}
  </a>`;
}

/* ── 首頁 ── */
// 摘要那行文字 → 對回 items.json 裡的新聞（模型改寫過，用字元重疊率對）
function matchItem(text){
  const norm = x => String(x||"").replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"").toLowerCase();
  const T = norm(text);
  if (T.length < 4) return null;
  const bg = T.length > 2
    ? Array.from({length: T.length - 1}, (_, i) => T.slice(i, i + 2))
    : [T];

  const scored = [];
  for (const d of ALL){
    const S = norm(d.title);
    if (!S) continue;
    let hit = 0;
    for (const g of bg) if (S.includes(g)) hit++;
    let score = hit / bg.length;
    // 原文標題比摘要長很多 → 打折，避免「什麼都沾一點」的長標題勝出
    const ratio = Math.min(S.length, T.length) / Math.max(S.length, T.length);
    score *= (0.55 + 0.45 * ratio);
    scored.push({ d, score });
  }
  scored.sort((a,b) => b.score - a.score);
  const best = scored[0], second = scored[1];
  if (!best || best.score < 0.45) return null;
  // 跟第二名太接近 → 表示只是模糊命中，寧可不可點也不要連錯文章
  if (second && best.score < second.score * 1.3) return null;
  return best.d;
}

function renderFeed(){
  // 視覺重量按素材決定：有圖才給大卡，沒圖一律小卡（避免大字空盒）
  const el = $("#feed");
  if (!ALL.length){
    el.innerHTML = '<div class="msg">今天沒有東西</div>';
    return;
  }
  const withPic = ALL.filter(d => d.img);
  const heads = withPic.slice(0, 2);
  const rest = ALL.filter(d => !heads.includes(d));
  let html = "";
  heads.forEach(d => { html += leadHTML(d); });
  rest.forEach((d, i) => { html += rowHTML(d, i < heads.length ? false : (i % 5 === 0 && !!d.img)); });
  el.innerHTML = html;
}

    { k:"disk",  v:(h.disk_free_gb ?? "—") + "G", cls:(h.disk_pct ?? 0) > 85 ? "bad" : "" },
    { k:"mem",   v:mem + "%", cls:mem >= 99 ? "bad" : "" },

    `<span class="si ${i.cls}"><span class="k">${i.k}</span><span class="v">${esc(String(i.v))}</span></span>`

function renderReminders(list){
  const el = $("#reminder");

  const one = list.map(r => {
    const soon = r.days <= 3 ? " soon" : "";

/* ── 簡報輕量排版：粗體／清單／emoji 分類／標籤行 ── */
function mdLite(t){
  const CAT = /^(🆕|📉|📦|🚫|🔥|📰|⭐|💰|🎮|🛒|🤖|🧠|🔧|⚠️|✅|❌)/u;
  const src = esc(String(t||""))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')      // **粗體** → <b>
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const money = x => String(x)
    .replace(/(→|➜|->)\s*(\d{1,7}(?:[.,]\d+)?)(?!\d)(?!\s*(件|個|筆|次|張|套|人))/g, '$1 RM$2')   // RM340→240 補成 RM240（長數字如時間戳不動）
    .replace(/(RM\s?\d[\d,]*(?:\.\d+)?)/g, '\u0001$1\u0002')  // 先標記，避免重複包
    .replace(/(→|➜|->)/g, '\u0003$1\u0004')
    .replace(/\u0001([^\u0002]+)\u0002/g, '<span class="price">$1</span>')
    .replace(/\u0003([^\u0004]+)\u0004/g, '<span class="arrow">$1</span>');

  // 一行多件 → 拆成多行（只切長句，避免把商品名切壞）
  const splitItems = x => {
    const v = String(x).trim();
    if (v.length <= 28 || !v.includes("、")) return [v];
    const out = []; let depth = 0, cur = "";
    for (const ch of v){
      if ("（(【[".includes(ch)) depth++;
      else if ("）)】]".includes(ch)) depth--;
      if (ch === "、" && depth <= 0){ if (cur.trim()) out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    if (cur.trim()) out.push(cur.trim());
    return out.length > 1 ? out : [v];      // 切不開就整條保留
  };

  const toneOf = (k, v) => {
    if (k !== "結論") return "";
    if (/^值得|^推薦|^可以試|^買/.test(v)) return " good";
    if (/^ obser|^觀察|^等|^先不|^暫/.test(v)) return " meh";
    if (/^不用|^別|^避/.test(v)) return " bad";
    return "";
  };

  const blocks = [];
  let cur = null;

  for (const raw of src.split("\n")){
    const ln = raw.trim();
    if (!ln){ cur = null; continue; }

    const li = ln.match(/^[・•·\-]\s*(.+)$/);
    if (li){
      if (cur && cur.type === "cat") cur.items.push(money(li[1]));
      else blocks.push({type:"ul", items:[money(li[1])]});
      continue;
    }

    const em = ln.match(/^([\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF]+)\uFE0F?\s*(.+)$/u);
    if (em && CAT.test(ln)){
      let title = em[2], rest = "";
      const c = title.search(/[：:]/);
      if (c > 0 && c <= 12){ rest = title.slice(c + 1).trim(); title = title.slice(0, c).trim(); }
      const dup = blocks.find(b => b.type === "cat" && b.emoji === em[1] && b.title === title);
      if (dup){
        if (rest) dup.items.push(...splitItems(rest).map(money));
        cur = dup;
      } else {
        cur = {type:"cat", emoji:em[1], title, items: rest ? splitItems(rest).map(money) : []};
        blocks.push(cur);
      }
      continue;
    }

    const lab = ln.match(/^(是什麼|對我們|結論|為什麼|怎麼做|注意)[：:]\s*(.+)$/);
    if (lab){
      blocks.push({type:"lab", k:lab[1], v:money(lab[2]), tone:toneOf(lab[1], lab[2])});
      cur = null; continue;
    }

    if (/^<b>.+<\/b>$/.test(ln)){ blocks.push({type:"h", v:ln}); cur = null; }
    else { blocks.push({type:"p", v:money(ln)}); cur = null; }
  }

  let html = "", firstCat = true, inNode = false;
  const closeNode = () => { if (inNode){ html += '</div>'; inNode = false; } };

  for (const b of blocks){
    if (b.type === "h"){
      // **1｜工具名** → 開一張子卡
      const m = b.v.match(/^<b>\s*(\d+)\s*[｜|]\s*(.+?)\s*<\/b>$/);
      if (m){
        closeNode();
        html += `<div class="tnode"><div class="th"><span class="tnum">${m[1]}</span><span class="ttl">${m[2]}</span></div>`;
        inNode = true;
      } else {
        closeNode();
        html += `<div class="nh2">${b.v}</div>`;
      }
      continue;
    }

    if (b.type === "cat"){
      closeNode();
      html += `<div class="ncat${firstCat ? " first" : ""}"><span class="nem">${b.emoji}</span><span class="nct">${b.title}</span></div>`;
      firstCat = false;
      if (b.items.length === 1) html += `<div class="np">${b.items[0]}</div>`;
      else if (b.items.length > 1) html += `<ul class="nl">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
      continue;
    }

    if (b.type === "ul"){
      html += `<ul class="nl">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
      continue;
    }

    if (b.type === "lab"){
      html += `<div class="nrow"><span class="nlab${b.tone}">${b.k}</span><span class="ntx">${b.v}</span></div>`;
      continue;
    }

    html += `<div class="np">${b.v}</div>`;
  }
  closeNode();
  return html;
}

/* 把簡報內文排版成可讀的區塊：健康檢查→鍵值列、價格→前後對比、總結→狀態藥丸 */
function renderBody(text){
  const raw = String(text || "");
  const STATUS = /^([✅⚠️❌🟢🟡🔴])\ufe0f?\s*([A-Za-z_][A-Za-z0-9_]*)\s+(.+)$/u;
  const lines = raw.split("\n");
  let out = "", buf = [], hlist = [], inH = false;

  const flushP = () => { if (buf.length){ out += mdLite(buf.join("\n")); buf = []; } };
  const flushH = () => {
    if (!hlist.length) return;
    const segs = hlist.map(([st, k]) => `<i class="seg ${st}"></i>`).join("");
    const labs = hlist.map(([st, k]) => `<span class="slab ${st}">${esc(shortKey(k))}</span>`).join("");
    const bad  = hlist.filter(([st]) => st !== "ok")
                       .map(([st, k, v]) => `<span class="bad ${st}">${esc(shortKey(k))} ${compact(k, v)}</span>`).join("");
    out += `<div class="sbar">${segs}</div><div class="slabs">${labs}</div>`
         + (bad ? `<div class="sbads">${bad}</div>` : "");
    hlist = [];
  };

  for (const ln of lines){
    const t = ln.trim();
    const m = t.match(STATUS);
    if (m){
      flushP();
      const sym = m[1];
      const st = (sym === "✅" || sym === "🟢") ? "ok" : (sym === "⚠️" || sym === "🟡") ? "warn" : "bad";
      hlist.push([st, m[2], m[3]]);
      inH = true;
      continue;
    }
    if (inH){ flushH(); inH = false; }
    if (/^健康檢查[:：]/.test(t)){
      flushP();
      const rid = (t.match(/(\d{8,})/) || [])[1] || "";
      out += `<div class="hrid">run ${rid.slice(-8)}</div>`;
      continue;
    }
    if (/^全部正常|^一切正常/.test(t)){
      flushP();
      out += `<div class="hsum ok">✓ ${esc(t)}</div>`;
      continue;
    }
    buf.push(ln);
  }
  flushH(); flushP();
  return out || mdLite(raw);
}

function sparkPath(items, w, h){
  const vals = items.filter(v => typeof v === "number" && v > 0);
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), span = Math.max(1, max - min);
  return vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - 4 - ((v - min) / span) * (h - 10);
    return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
}


/* 卡價卡：股票 watchlist 式，一行一項；預設只列變動最大的 5 項 */
function priceBody(text){
  const lines = String(text || "").split("\n");
  const items = [];
  for (const raw of lines){
    const t = raw.trim();
    if (!t) continue;
    // 標題行（沒有箭頭、沒有 📈 的開頭）直接跳過
    if (!/→/.test(t) && !/^[📈📉]/.test(t)) continue;
    if (/^[📈📉]/.test(t)){
      items.push({ name: t.replace(/^[^\p{L}\p{N}]+/u, "").trim(), rows: [] });
      continue;
    }
    const m = t.match(/^(.*?)\s*¥?([\d,]+)\s*(?:→|➜|->)\s*¥?([\d,]+)\s*([^\d]*)$/);
    if (!m || !items.length) continue;
    const from = +m[2].replace(/,/g, ""), to = +m[3].replace(/,/g, "");
    if (!from) continue;
    items[items.length - 1].rows.push({
      label: (m[1] || "").trim() || "最低在售",
      from, to, unit: (m[4] || "").trim(), pct: (to - from) / from * 100,
    });
  }
  if (!items.length) return renderBody(text);

  // 每項取「變化最大」的那一列做代表，依絕對幅度排序
  const flat = items.map(it => {
    const r = it.rows.slice().sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))[0] || {};
    return { name: it.name, r, all: it.rows };
  }).sort((a, b) => Math.abs(b.r.pct || 0) - Math.abs(a.r.pct || 0));

  const SHOW = 5;
  const row = (x, i) => {
    const r = x.r, pct = r.pct || 0;
    const cls = Math.abs(pct) < 0.05 ? "flat" : (pct < 0 ? "dn" : "up");
    const isQty = /件/.test(r.unit || "");
    const val = isQty ? r.to + " 件" : (r.to || 0).toLocaleString();
    const more = x.all.length > 1
      ? x.all.filter(y => y !== r).map(y =>
          `<div class="tsub">${esc(y.label)} ${y.from.toLocaleString()} → ${y.to.toLocaleString()}${/件/.test(y.unit) ? " 件" : ""}
             <em class="${y.pct < 0 ? "dn" : y.pct > 0 ? "up" : "flat"}">${y.pct > 0 ? "+" : ""}${y.pct.toFixed(1)}%</em></div>`).join("")
      : "";
    return `<div class="trow ${i >= SHOW ? "hid" : ""}" data-i="${i}">
        <div class="tmain">
          <span class="tname">${esc(x.name)}</span>
          <span class="tval">${val}</span>
          <span class="tchip ${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span>
        </div>
        <div class="tlbl">${r.label && r.label !== "最低在售" ? esc(r.label) : "&nbsp;"}</div>
        <div class="tmore">${more}</div>
      </div>`;
  };

  const hidden = flat.length - SHOW;
  return flat.map(row).join("")
    + (hidden > 0 ? `<button class="tmore-btn" onclick="this.previousElementSibling||0;document.querySelectorAll('.trow.hid').forEach(e=>e.classList.remove('hid'));this.remove()">還有 ${hidden} 項</button>` : "");
}

/* 壓縮：標籤與數值都只留必要資訊 */
function shortKey(k){
  return ({ freshness:"新鮮", volume:"筆數", schema:"欄位", quality:"品質", heartbeat:"心跳" })[String(k).toLowerCase()] || esc(k);
}
function compact(k, v){
  const t = String(v);
  const h = t.match(/([\d.]+)\s*小時/);
  const n = t.match(/([\d,]{3,})/);              // 第一個「像數字」的東西（筆數 77596 / 60 個欄位）
  const p = t.match(/差\s*(-?[\d.]+)\s*%/);
  switch (String(k).toLowerCase()){
    case "freshness":   return h ? h[1] + " <i>h</i>" : esc(t.slice(0, 20));
    case "heartbeat":   return h ? h[1] + " <i>h</i>" : esc(t.slice(0, 20));
    case "volume":      return (n ? fmtNum(n[1]) : "—") + (p ? ` <em class="${p[1].startsWith("-") ? "dn" : "up"}">${p[1]}%</em>` : "");
    case "schema":      { const cols = t.match(/(\d+)\s*個/); return (cols ? cols[1] + " <i>欄</i>" : "") + (/一致/.test(t) ? ` <em class="ok">一致</em>` : ""); }
    case "quality":     return /無重複/.test(t) ? "無重複" : (/完整/.test(t) ? "完整" : esc(t.slice(0, 12)));
    default:            return esc(t.slice(0, 24));
  }
}
function fmtNum(x){ return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* 從文字裡抽出數字畫成「餘裕條」：所有行同一個意思，越長＝離紅線越遠 */
function vizBar(key, val, st){
  const num = (re) => { const m = String(val).match(re); return m ? parseFloat(m[1].replace(/,/g, "")) : null; };
  const clamp = (v) => Math.max(4, Math.min(100, v));
  let score = null;

  if (/freshness/i.test(key)){
    const h = num(/([\d.]+)\s*小時/); if (h !== null) score = 100 - Math.min(h, 6) * 15;
  } else if (/heartbeat/i.test(key)){
    const h = num(/([\d.]+)\s*小時/); if (h !== null) score = 100 - Math.min(h, 6) * 12;
  } else if (/volume/i.test(key)){
    const d = num(/差\s*(-?[\d.]+)\s*%/); if (d !== null) score = 100 - Math.min(Math.abs(d), 10) * 8;
  } else if (/quality|schema/i.test(key)){
    score = 100;
  }
  if (score === null) return "";
  const tone = score < 40 ? "bad" : score < 70 ? "warn" : "ok";
  return `<i class="hbar" title="餘裕 ${score.toFixed(0)}"><b class="${tone}" style="width:${clamp(score).toFixed(0)}%"></b></i>`;
}

/* ── 問凜：把這則新聞推回對話 ─────────────────────────────

const BOT = "hermes_unrokdeajl5yb2k7_bot";
function askRin(link){
  const d = BYLINK[link] || { link };
  const title = titleOf(d) || "";
  const src = d.source || "";
  const head = `問凜｜${title}${src ? "（" + src + "）" : ""}`;

  // 先複製到剪貼簿當備援（Telegram 沒裝或分享取消時還貼得上）
  try { navigator.clipboard && navigator.clipboard.writeText(msg); } catch(e){}
  location.href = "https://t.me/share/url?url=" + encodeURIComponent(d.link || link)

}

async function load(){
  try {
    const r = await fetch("items.json?t=" + Date.now(), {cache:"no-store"});

    const j = await r.json();

    let feed = null;
    try {
      const fr = await fetch("feed.json?t=" + Date.now(), {cache:"no-store"});
      if (fr.ok){ const a = await fr.json(); if (Array.isArray(a) && a.length) feed = new Set(a); }
    } catch(e){}
    try {
      const nr = await fetch("notes2.json?t=" + Date.now(), {cache:"no-store"});
      if (nr.ok){ const o = await nr.json();
          if (o && typeof o === "object"){
            // 2026-11-09：curate 模型曾把 29 條 link 全寫成同一句，前端全部同標題。
            // 同一句重複 >3 次就當壞資料丟掉，退回 zh／原標題。
            const cnt = {}; Object.values(o).forEach(v => cnt[v] = (cnt[v]||0)+1);
            Object.keys(o).forEach(k => { if (cnt[o[k]] > 3) delete o[k]; });
            NOTES = o;
          } }
    } catch(e){}
    try {
      const tr = await fetch("notices.json?t=" + Date.now(), {cache:"no-store"});
      if (tr.ok){ const a = await tr.json(); if (Array.isArray(a)) NOTICES = a; }
    } catch(e){}
    try {
      const dr = await fetch("digest.json?t=" + Date.now(), {cache:"no-store"});
      if (dr.ok){ DIGEST = await dr.json(); }
    } catch(e){}
    try {
      const sr = await fetch("status.json?t=" + Date.now(), {cache:"no-store"});
      if (sr.ok){
        const st = await sr.json();
        renderStatus(st);
        renderReminders(st.reminders);
      }
    } catch(e){}

    ALL = (j.items||[]).filter(d => !feed || feed.has(d.link))
                       .sort((a,b) => (b.ts||0)-(a.ts||0));
    PICKS = (j.picks && j.picks.length) ? j.picks.slice() : ALL.slice(0,10);
    if (feed){
      PICKS = PICKS.filter(d => feed.has(d.link));

    }

    renderFeed(); renderGameNews(); renderNotices();

  } catch(e){
    $("#feed").innerHTML = '<div class="msg">拿不到資料，確認網路或等下次更新</div>';
  }
}

/* ══ 手勢 ══ */
(() => {
  const ptr = $("#ptr"), reader = $("#reader");
  const isOpen = () => reader && reader.classList.contains("on");

  // 1) 下拉刷新（在頁面最頂往下拉超過 70px）
  let sy = 0, pulling = false, pullingArmed = false;
  document.addEventListener("touchstart", e => {
    if (isOpen() || e.touches.length !== 1) return;
    pullingArmed = window.scrollY <= 0;
    sy = e.touches[0].clientY;
    pulling = false;
  }, {passive:true});

  document.addEventListener("touchmove", e => {
    if (!pullingArmed || isOpen() || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - sy;
    if (dy <= 0 || window.scrollY > 0){ ptr.classList.remove("show"); return; }
    pulling = true;
    const pull = Math.min(dy, 110);
    if (pull > 12){
      ptr.classList.add("show");
      ptr.style.transform = `translate(-50%, ${Math.min(pull * 0.55, 58) + 4}px) rotate(${pull * 2}deg)`;
    }
  }, {passive:true});

  document.addEventListener("touchend", e => {
    if (!pulling){ ptr.classList.remove("show"); ptr.style.transform = ""; return; }
    const dy = (e.changedTouches[0]?.clientY || 0) - sy;
    pulling = false; pullingArmed = false;
    if (dy > 70 && window.scrollY <= 0){
      ptr.style.transform = "";
      ptr.classList.add("spin");
      load().finally(() => setTimeout(() => {
        ptr.classList.remove("spin", "show");
        ptr.style.transform = "";
      }, 420));
    } else {
      ptr.classList.remove("show");
      ptr.style.transform = "";
    }
  }, {passive:true});

  // 2) 閱讀模式：右滑／下滑關閉（不限定邊緣 —— Android 系統返回手勢會先吃掉邊緣滑動）
  let rx = 0, ry = 0, dragging = false, closedByGesture = false, canPan = false;
  reader.addEventListener("touchstart", e => {
    if (!isOpen()) return;
    rx = e.touches[0].clientX;
    ry = e.touches[0].clientY;
    dragging = true;
    closedByGesture = false;
    // 整個畫面都能水平滑動（touch-action:pan-y 已宣告水平手勢歸 app 管）
    canPan = true;
  }, {passive:true});

  reader.addEventListener("touchmove", e => {
    if (!dragging || !isOpen()) return;
    const dx = e.touches[0].clientX - rx;
    const dy = e.touches[0].clientY - ry;
    // 水平滑動：左右都可以，跟手橫移
    if (canPan && Math.abs(dx) > 10 && Math.abs(dy) < Math.abs(dx) * 0.9){
      e.preventDefault();                    // 不讓瀏覽器把這一下當成上一頁/下一頁
      reader.style.transition = "none";
      reader.style.transform = `translateX(${Math.max(-400, Math.min(400, dx))}px)`;
      reader.style.opacity = String(Math.max(0.5, 1 - Math.abs(dx) / 700));
    }
    // 下滑：稍微跟手（做出可關閉的回饋）
    else if (dy > 40 && dx < 40 && Math.abs(dx) < Math.abs(dy)){
      reader.style.transition = "none";
      reader.style.opacity = String(Math.max(0.35, 1 - dy / 500));
    }
  }, {passive:false});

  const endSwipe = e => {
    if (!dragging) return;
    dragging = false;
    const dx = (e.changedTouches[0]?.clientX || rx) - rx;
    const dy = (e.changedTouches[0]?.clientY || ry) - ry;
    reader.style.transition = "";
    reader.style.transform = "";
    reader.style.opacity = "";
    if (Math.abs(dx) > 70 && Math.abs(dy) < 80){
      closedByGesture = true;
      $("#rclose").click();
    } else if (dy > 130 && Math.abs(dx) < 70){
      closedByGesture = true;
      $("#rclose").click();
    }
  };
  reader.addEventListener("touchend", endSwipe, {passive:true});
  reader.addEventListener("touchcancel", endSwipe, {passive:true});

  // 3) 點兩下頂部（標題那行）→ 回到最上面
  let lastTap = 0;
  document.querySelector("#p-home header").addEventListener("click", e => {
    if (e.target.closest("button, a")) return;
    const now = Date.now();
    if (now - lastTap < 320){
      window.scrollTo({top:0, behavior:"smooth"});
      e.preventDefault();
    }
    lastTap = now;
  });
})();

<script>
/* 首字放大只在中文文章生效：英文字開頭會把 "DeepSeek" 拆成 D + eepSeek */
(function(){
  const fix = root => {
    const p = root && root.querySelector ? root.querySelector('.rwrap p') : null;
    if(!p) return;
    const t = (p.textContent || '').trim();
    p.classList.toggle('no-drop', /^[A-Za-z0-9]/.test(t));

<script>
/* 搜尋：對 items.json 全量搜，結果用同一套 .row 樣式渲染 */
(function(){
  const btn=document.getElementById('sch'), bar=document.getElementById('sbar');
  const inp=document.getElementById('sinput'), clr=document.getElementById('sclear');
  const cnt=document.getElementById('scount');
  const feed=document.getElementById('feed'), res=document.getElementById('sresults');
  if(!btn||!bar||!res) return;

  const LABEL={game:"遊戲",tech:"科技",ai:"AI",local:"本地",toy:"玩具模型",image:"圖像",
               pipeline:"工具",hermes:"Hermes",hype:"潮物",news:"新聞",dev:"開發"};
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm=t=>String(t||'').toLowerCase().replace(/\s+/g,'');
  const ago=ts=>{ if(!ts) return '';
    const s=Math.floor(Date.now()/1000-ts);
    if(s<60) return '剛剛'; if(s<3600) return Math.floor(s/60)+' 分鐘';
    if(s<86400) return Math.floor(s/3600)+' 小時';
    if(s<604800) return Math.floor(s/86400)+' 天';
    return new Date(ts*1000).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}); };

  let DATA=null, loading=false;
  async function data(){
    if(DATA) return DATA;
    if(loading) return null;
    loading=true;
    try{
      const r=await fetch('items.json?t='+Date.now(),{cache:'no-store'});
      const j=await r.json();
      DATA=(j.items||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
    }catch(e){ DATA=[]; }
    loading=false;
    return DATA;
  }

  function row(d){
    return '<a class="row" href="'+esc(d.link)+'" target="_blank" rel="noopener">'
      + '<span class="txt"><div class="t">'+esc(d.title)+'</div>'
      + '<div class="m"><span class="cat">'+esc(LABEL[d.cat]||d.cat||'其他')+'</span>'
      + '<span class="s">'+esc(d.source||'')+'</span><span>·</span><span>'+ago(d.ts)+'</span></div></span></a>';
  }

  async function run(){
    const q=norm(inp.value);
    if(!q){ res.hidden=true; res.innerHTML=''; feed.style.display=''; cnt.textContent=''; return; }
    const list=await data();
    if(list===null) return;
    const hits=list.filter(d=>norm((d.title||'')+(d.source||'')+(d.summary||'')).includes(q)).slice(0,60);
    feed.style.display='none';
    res.hidden=false;
    res.innerHTML = hits.length
      ? hits.map(row).join('')
      : '<div class="msg">「'+esc(inp.value)+'」沒有結果</div>';
    cnt.textContent = hits.length+' 則';
  }

  btn.addEventListener('click',()=>{
    const on=bar.classList.toggle('on');
    btn.classList.toggle('on',on);
    if(on){ setTimeout(()=>inp.focus(),30); data(); }
    else { inp.value=''; run(); }
  });
  inp.addEventListener('input',run);
  clr.addEventListener('click',()=>{ inp.value=''; run(); inp.focus(); });
})();
</script>
<script>
/* 2026-11-09：舊版 service worker 會把舊頁留在手機上（改版後仍看到舊標題），
   這裡主動移除所有 SW 與快取。本站資料每次上網抓，不需要離線殼。 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { try { r.unregister(); } catch (e) {} }));
  if (window.caches && caches.keys) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
}
</script>
